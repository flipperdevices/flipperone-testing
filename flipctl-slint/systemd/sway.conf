# The compositor that owns the panel. flipctl is its client, and so is every app.
#
# Deliberately bare: no bar, no borders, no gaps, no cursor and no Xwayland, since
# the only surfaces here are flipctl's UI and whatever app is in front, both
# fullscreen on a 256x144 output.
output * mode 256x144
default_border none
default_floating_border none
focus_follows_mouse no
xwayland disable
seat * hide_cursor 1

# Two keys are flipctl's, whatever has focus. An app hosted here holds the
# keyboard while it is in front, so without this it could swallow Back and the
# app switcher and there would be no way out of it. Everything else, the D-pad
# and the centre press included, goes to the app: that is the forwarding policy,
# and the compositor enforces it rather than us.
#
# They reach flipctl through the input endpoint it already serves, so there is no
# second control channel to build or to secure. The payload lives in a script
# because sway reads braces as block delimiters, so JSON in a bindsym breaks the
# parse from that line on. Keep braces out of this file entirely, comments
# included, and keep every directive on one line: both have cost an evening.
bindsym --no-repeat BackSpace exec /etc/flipctl/flipctl-key.sh back
bindsym --no-repeat Tab       exec /etc/flipctl/flipctl-key.sh appsw

exec /etc/flipctl/start-flipctl.sh
