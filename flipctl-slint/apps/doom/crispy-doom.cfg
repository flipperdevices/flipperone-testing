# Crispy Doom on a 256x144 panel.
#
# The window is 320x200 and cannot be smaller: this family of Doom ports clamps the
# window to at least the size it renders, so asking for 256x144 here gets a 320x200
# window anyway, and tiling that into a 256x144 output shows a corner of the frame.
# That was the "wrong resolution".
#
# What fits the picture on the panel is the compositor scaling the output, which
# flipctl does from `size = "320x200"` in app.toml while Doom is in front. These two
# numbers only have to agree with what the game will actually take.
#
# No aspect correction, because 320x200 already matches what the scaling produces,
# and no integer scaling, because 256x144 is not a whole multiple of anything Doom
# draws. vsync on: a game presenting faster than the panel can show is the other
# thing that looks like strobing.
#
# Loaded with -extraconfig, so it lives with the app rather than in a home directory
# somebody has to remember.
# Off, or Crispy renders 640x400 and the 320x200 window shows a quarter of it.
# "High Resolution Rendering" doubles what the game draws, which is the right default
# on a monitor and the wrong one on a panel that has 144 rows.
crispy_hires                  0
fullscreen                    0
window_width                  320
window_height                 200
aspect_ratio_correct          0
integer_scaling               0
force_software_renderer       1
crispy_vsync                  1
# Render between tics rather than only on them. Doom's tick rate is 35Hz, so capped it
# draws 35 frames a second whatever the panel can take; uncapped it draws as fast as
# the compositor lets it and the panel's own commit becomes the limit, measured at 53
# frames a second with a browser view attached and 62 without. vsync stays on, so it
# presents on frame callbacks rather than spinning.
crispy_uncapped               1
crispy_smoothscaling          0
