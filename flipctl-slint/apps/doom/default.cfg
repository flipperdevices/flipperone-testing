# The panel's soft keys, added to Doom's own defaults.
#
# Movement is deliberately absent. Doom's built-in bindings already walk and turn
# with the arrows, and the four scancodes I wrote here from memory stopped the D-pad
# working, so the lesson is to override only what has to change: an omitted key keeps
# its default, and a wrong one silently does not.
#
# DOS scancodes, which is what this file has always spoken. The five soft keys arrive
# as z x c v b (see flipper-one-input.c), so fire and use land under the thumb:
#
#   z (0x2c = 44) fire     x (0x2d = 45) use     c (0x2e = 46) run
#
# If these turn out wrong too, they cost nothing: the pad still walks.
key_fire                      44
key_use                       45
key_speed                     46
