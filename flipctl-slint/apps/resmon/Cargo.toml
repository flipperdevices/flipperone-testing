# Its own workspace, so this crate is independent of whatever it happens to sit
# inside. Without it cargo refuses to build: a crate under a workspace directory
# is assumed to be a member of it.
[workspace]

[package]
name = "resmon-app"
version = "0.1.0"
edition = "2021"
publish = false

# Read by flipctl without building this crate, so the app can be listed and
# offered a build before a binary exists.
[package.metadata.flipctl]
name = "Resources"

# Everything read here comes out of /proc and /sys. What is not free is the
# drawing: flipctl-app is the framework, and through it the widgets, the panel's
# fonts and the Slint software renderer.
[dependencies]
flipctl-app = { path = "../../crates/flipctl-app" }
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "backend-winit-wayland", "renderer-software", "std"] }

[build-dependencies]
flipctl-app = { path = "../../crates/flipctl-app", features = ["build"] }

[profile.release]
opt-level = "z"
strip = true
