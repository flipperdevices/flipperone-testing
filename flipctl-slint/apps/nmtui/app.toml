# Network Manager's own text interface, on the panel.
#
# Nothing of ours: flipctl hands the panel to the kernel's VT and nmtui runs
# there. Worth having as an app because it is the one tool that can join a wifi
# network, edit a connection or bring an interface up without a keyboard and a
# shell, and it comes with the network-manager the device already runs on.
name = "nmtui"
console = "nmtui"
apt = ["network-manager"]
