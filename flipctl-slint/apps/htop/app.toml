# htop in a terminal emulator that is itself a Wayland client.
#
# The kernel's VT used to be the terminal, which meant handing over the console,
# the framebuffer and DRM master, and only one such program could run at a time.
# `foot` is a terminal that draws as a client, so htop becomes an app like any
# other: several can run at once, the font is not limited to what KDFONTOP takes,
# and nothing touches the panel but flipctl.
name = "htop"
wayland = "foot --font=monospace:size=6 -e htop"
apt = ["foot", "htop"]
