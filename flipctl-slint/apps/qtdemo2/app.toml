# A clock, drawn by Qt as an ordinary Wayland client.
#
# Nothing here hands over a device. The app joins the compositor that owns the
# panel on a workspace of its own, and Qt's own Wayland backend does the drawing:
# no offscreen rendering, no writing to /dev/fb0, no checking whether it is
# visible, and no VT. flipctl sets QT_QPA_PLATFORM, so the manifest names a
# command and nothing else.
name = "Qt Clock"
wayland = "python3 app.py"
apt = ["python3-pyqt6", "qt6-wayland"]
