[package]
name = "flipper-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared UI component library for the Flipper One 256x144 panel"

[features]
default = []
# DRM/KMS panel sink and raw evdev input. Off by default so host-side tests and
# the golden-image harness build without touching /dev.
device = ["drm"]
# Built-in browser remote view. Default off so flipperos-installer and
# flipper-boot-menu never pay for it.
remote = []
# Slint software renderer targeting Gray8. No backend: we own KMS and input, so
# `renderer-software` is taken on its own and the LinuxKMS backend (with its
# libinput/libxkbcommon/fontconfig tree) is never pulled in.
slint = ["dep:slint", "dep:slint-build", "dep:i-slint-common"]
# Hosting other programs: one `cage` per app, read with wlr-screencopy and driven
# with a virtual keyboard. Off by default, and deliberately so: the installer, the
# boot menu and recovery draw their own UI and never host anything, so they must
# not pull wlroots in. Layer 2 of the two the plan describes.
# Convert and scale a hosted app's frames on the GPU rather than the CPU. Layer 2
# only: nothing in the boot menu, the installer or recovery goes near EGL.
gpu = [
    "wayland",
    "dep:khronos-egl",
    "dep:libloading",
]
wayland = [
    "dep:serde",
    "dep:serde_json",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-wlr",
    "dep:wayland-protocols-misc",
]

[dependencies]
# getifaddrs, for the idle screen's IPv4 addresses. procfs exposes IPv6 as text
# but has no IPv4 equivalent, and a UI process should not be shelling out to `ip`.
libc = "0.2"
drm = { version = "0.14", optional = true }
# For sway's IPC replies. Hand-parsing them cost three bugs: a `num` field on every
# node in the tree, a workspace bounded by "the next num", and finally pretty-printed
# JSON that no substring search matched. A parser is smaller than those mistakes.
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
libloading = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
wayland-protocols-misc = { version = "0.3", features = ["client"], optional = true }

# Not used directly. Present only to switch fontique's fontconfig binding to
# dlopen, which the `slint` facade does not re-export. Cargo unifies features
# across the graph, so this reaches the fontique that i-slint-core pulls in via
# parley and removes libfontconfig (plus freetype, expat, png, brotli, bz2) from
# the link line. We embed glyphs at compile time and never enumerate system
# fonts, so nothing looks for the library at runtime either.
[dependencies.i-slint-common]
version = "=1.17.1"
features = ["fontconfig-dlopen"]
optional = true

[dependencies.slint]
version = "1.17"
default-features = false
features = ["compat-1-2", "renderer-software", "std", "unsafe-single-threaded"]
optional = true

[build-dependencies]
flipper-tokens = { path = "../flipper-tokens" }
slint-build = { version = "1.17", optional = true }

[dev-dependencies]
png = "0.17"

# Declared so `cargo test` does not try to build them without the feature: examples
# are built by the test profile, and these two use a module that is gated out.
[[example]]
name = "gpu_probe"
required-features = ["gpu"]

[[example]]
name = "wl_probe"
required-features = ["wayland"]

[[example]]
name = "wl_sink_probe"
required-features = ["wayland"]
