name: Edge exporter tests

on:
  push:
    branches:
      - neural-link-edge-exporter
  pull_request:
    branches:
      - neural-link-edge-exporter

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
